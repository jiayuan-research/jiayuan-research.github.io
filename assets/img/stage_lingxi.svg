<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="g5" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff6e0"/>
      <stop offset="1" stop-color="#ffd27f"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="16" fill="url(#g5)"/>
  <!-- Data flywheel (circular arrows) -->
  <g transform="translate(150 140)">
    <circle r="70" fill="none" stroke="#b06a00" stroke-width="8" stroke-dasharray="16 10"/>
    <!-- Center node -->
    <circle r="26" fill="#b06a00"/>
    <text x="0" y="5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Lingxi</text>
    <!-- 3 small nodes around -->
    <circle cx="0" cy="-70" r="14" fill="#2d7a3a"/>
    <circle cx="60" cy="35" r="14" fill="#1f5eb3"/>
    <circle cx="-60" cy="35" r="14" fill="#b73aa0"/>
    <!-- Mini arrow heads on the circle -->
    <polygon points="70,0 60,-8 60,8" fill="#b06a00"/>
    <polygon points="-70,0 -60,-8 -60,8" fill="#b06a00"/>
  </g>
  <!-- Label -->
  <text x="150" y="265" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#6b3f00" text-anchor="middle">DATA FLYWHEEL</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" class="ovw" viewBox="0 0 880 452" role="img" aria-labelledby="ovt ovd"><style>
text{font-family:'Bricolage Grotesque',Inter,Helvetica,Arial,sans-serif}
.t{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.12em}.h{font:700 17px 'Bricolage Grotesque',sans-serif}
.p{font:400 14px 'Bricolage Grotesque',sans-serif}.m{font:500 14px 'JetBrains Mono',monospace}.sb{font-size:10px}.bn{font:700 12px 'JetBrains Mono',monospace}
.gn{font:700 15px 'Bricolage Grotesque',sans-serif;fill:#161c1a}.ax{font:400 12px 'JetBrains Mono',monospace;fill:#8a918d}.ref{fill:#161c1a}
.nm{font:400 14px 'Bricolage Grotesque',sans-serif;fill:#555d59}.nm.ours{font-weight:700;fill:#1d45a8}

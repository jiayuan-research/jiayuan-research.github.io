</style><rect width="100%" height="100%" fill="#f7f6f2"/><title id="ovt">TestGRAD: one optimization iteration in four stages</title><desc id="ovd">An issue and repository go to N SWE agents, which produce candidate patches. The repository test suite y_t is the optimization state. Stage 1, forward pass: every test is executed on every candidate patch. Stage 2, differential loss: the loss is 0 if some test passes on some patches and fails on others, otherwise 1. At loss 0 a checker selects the final patch. At loss 1, stage 3: the failed update is written to failure memory and mined into Failure Pattern Momentum m_t. Stage 4, backward pass: an LLM optimizer uses the loss, the current suite and the momentum to write a CRUD update, giving the next suite y_t+1.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555d59"/></marker><marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a5bd7"/></marker><marker id="ahJ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8f6c"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf5b4f"/></marker></defs><rect x="0" y="40" width="120" height="112" fill="#ffffff" stroke="rgba(22,28,26,.24)"/><path d="M0,53 V40 H13 M107,152 H120 V139" fill="none" stroke="rgba(22,28,26,.55)" stroke-width="2.4"/><text x="14" y="64" class="t" fill="#555d59" text-anchor="start">INPUT</text><text x="14" y="96" class="h" fill="#161c1a" text-anchor="start">Issue</text><text x="14" y="126" class="h" fill="#161c1a" text-anchor="start">Repository</text><rect x="170" y="20" width="210" height="152" fill="#ffffff" stroke="rgba(22,28,26,.24)"/><path d="M170,33 V20 H183 M367,172 H380 V159" fill="none" stroke="rgba(22,28,26,.55)" stroke-width="2.4"/><text x="184" y="44" class="t" fill="#555d59" text-anchor="start">CANDIDATE PATCHES</text><rect x="184" y="62" width="38" height="34" fill="#fff" stroke="rgba(22,28,26,.3)"/><text x="203" y="85" class="m" fill="#161c1a" text-anchor="middle">p<tspan dy="4" class="sb">1</tspan><tspan dy="-4">​</tspan></text><rect x="228" y="62" width="38" height="34" fill="#fff" stroke="rgba(22,28,26,.3)"/><text x="247" y="85" class="m" fill="#161c1a" text-anchor="middle">p<tspan dy="4" class="sb">2</tspan><tspan dy="-4">​</tspan></text><rect x="272" y="62" width="38" height="34" fill="#fff" stroke="rgba(22,28,26,.3)"/><text x="291" y="85" class="m" fill="#161c1a" text-anchor="middle">p<tspan dy="4" class="sb">3</tspan><tspan dy="-4">​</tspan></text><rect x="334" y="62" width="38" height="34" fill="#fff" stroke="rgba(22,28,26,.3)"/><text x="353" y="85" class="m" fill="#161c1a" text-anchor="middle">p<tspan dy="4" class="sb">N</tspan><tspan dy="-4">​</tspan></text><text x="322" y="85" class="p" fill="#555d59" text-anchor="middle">…</text><text x="184" y="126" class="p" fill="#555d59" text-anchor="start">one patch per SWE agent,</text><text x="184" y="148" class="p" fill="#555d59" text-anchor="start">N agents in the ensemble</text><rect x="170" y="304" width="210" height="144" fill="#f1f4fd" stroke="rgba(42,91,215,.55)"/><path d="M170,317 V304 H183 M367,448 H380 V435" fill="none" stroke="#2a5bd7" stroke-width="2.4"/><text x="184" y="328" class="t" fill="#1d45a8" text-anchor="start">STATE · TEST SUITE</text><text x="184" y="362" class="h" fill="#1d45a8" text-anchor="start">y<tspan dy="4" class="sb">t</tspan><tspan dy="-4">​</tspan></text><text x="210" y="362" class="p" fill="#555d59" text-anchor="start">the repository's tests,</text><text x="184" y="386" class="p" fill="#555d59" text-anchor="start">one CRUD edit per iteration</text><text x="184" y="424" class="m" fill="#1d45a8" text-anchor="start">y<tspan dy="4" class="sb">0</tspan><tspan dy="-4">​</tspan> = original suite</text><rect x="440" y="196" width="190" height="84" fill="#ffffff" stroke="rgba(22,28,26,.24)"/><path d="M440,209 V196 H453 M617,280 H630 V267" fill="none" stroke="rgba(22,28,26,.55)" stroke-width="2.4"/><rect x="452" y="208" width="21" height="21" fill="#2a5bd7"/><text x="462.5" y="223" text-anchor="middle" class="bn" fill="#fff">1</text><text x="482" y="224" class="t" fill="#555d59" text-anchor="start">FORWARD PASS</text><text x="452" y="262" class="h" fill="#161c1a" text-anchor="start">Execute</text><rect x="566" y="234" width="10" height="9" fill="rgba(47,143,108,.75)"/><rect x="579" y="234" width="10" height="9" fill="rgba(47,143,108,.75)"/><rect x="592" y="234" width="10" height="9" fill="rgba(47,143,108,.75)"/><rect x="605" y="234" width="10" height="9" fill="rgba(47,143,108,.75)"/><rect x="566" y="246" width="10" height="9" fill="rgba(207,91,79,.75)"/><rect x="579" y="246" width="10" height="9" fill="rgba(207,91,79,.75)"/><rect x="592" y="246" width="10" height="9" fill="rgba(207,91,79,.75)"/><rect x="605" y="246" width="10" height="9" fill="rgba(207,91,79,.75)"/><rect x="566" y="258" width="10" height="9" fill="rgba(207,91,79,.75)"/><rect x="579" y="258" width="10" height="9" fill="rgba(47,143,108,.75)"/><rect x="592" y="258" width="10" height="9" fill="rgba(207,91,79,.75)"/><rect x="605" y="258" width="10" height="9" fill="rgba(47,143,108,.75)"/><rect x="563" y="255" width="55" height="15" fill="none" stroke="#2a5bd7" stroke-width="1.5"/><rect x="680" y="196" width="200" height="84" fill="#ffffff" stroke="rgba(22,28,26,.24)"/><path d="M680,209 V196 H693 M867,280 H880 V267" fill="none" stroke="rgba(22,28,26,.55)" stroke-width="2.4"/><rect x="692" y="208" width="21" height="21" fill="#2a5bd7"/><text x="702.5" y="223" text-anchor="middle" class="bn" fill="#fff">2</text><text x="722" y="224" class="t" fill="#555d59" text-anchor="start">DIFFERENTIAL LOSS</text><text x="692" y="262" class="h" fill="#161c1a" text-anchor="start">L(y<tspan dy="4" class="sb">t</tspan><tspan dy="-4">​</tspan>) ∈ {0, 1}</text><rect x="680" y="14" width="200" height="136" fill="#f0f7f3" stroke="rgba(47,143,108,.55)"/><path d="M680,27 V14 H693 M867,150 H880 V137" fill="none" stroke="#2f8f6c" stroke-width="2.4"/><text x="694" y="38" class="t" fill="#1f6b4f" text-anchor="start">STOP · LOSS = 0</text><text x="694" y="66" class="h" fill="#161c1a" text-anchor="start">Checker selects</text><text x="694" y="90" class="h" fill="#161c1a" text-anchor="start">the final patch</text><text x="694" y="116" class="p" fill="#555d59" text-anchor="start">invoked once, outside</text><text x="694" y="136" class="p" fill="#555d59" text-anchor="start">the optimization loop</text><rect x="680" y="304" width="200" height="144" fill="#ffffff" stroke="rgba(22,28,26,.24)"/><path d="M680,317 V304 H693 M867,448 H880 V435" fill="none" stroke="rgba(22,28,26,.55)" stroke-width="2.4"/><rect x="692" y="316" width="21" height="21" fill="#2a5bd7"/><text x="702.5" y="331" text-anchor="middle" class="bn" fill="#fff">3</text><text x="722" y="332" class="t" fill="#555d59" text-anchor="start">MOMENTUM</text><text x="692" y="366" class="p" fill="#161c1a" text-anchor="start">failed update → memory</text><text x="692" y="390" class="p" fill="#161c1a" text-anchor="start">mine frequent sequences</text><text x="692" y="424" class="m" fill="#1d45a8" text-anchor="start">m<tspan dy="4" class="sb">t</tspan><tspan dy="-4">​</tspan> = Mine<tspan dy="4" class="sb">β</tspan><tspan dy="-4">​</tspan>(M ‖ ∇)</text><rect x="440" y="304" width="190" height="144" fill="#f1f4fd" stroke="rgba(42,91,215,.55)"/><path d="M440,317 V304 H453 M617,448 H630 V435" fill="none" stroke="#2a5bd7" stroke-width="2.4"/><rect x="452" y="316" width="21" height="21" fill="#2a5bd7"/><text x="462.5" y="331" text-anchor="middle" class="bn" fill="#fff">4</text><text x="482" y="332" class="t" fill="#1d45a8" text-anchor="start">BACKWARD PASS</text><text x="452" y="366" class="h" fill="#161c1a" text-anchor="start">LLM optimizer</text><text x="452" y="392" class="p" fill="#555d59" text-anchor="start">writes one CRUD edit ∇</text><text x="452" y="424" class="m" fill="#1d45a8" text-anchor="start">y<tspan dy="4" class="sb">t+1</tspan><tspan dy="-4">​</tspan> = y<tspan dy="4" class="sb">t</tspan><tspan dy="-4">​</tspan> + ∇</text><path d="M120,96 H166" fill="none" stroke="#555d59" stroke-width="1.8" marker-end="url(#ah)"/><path d="M60,152 V370 H166" fill="none" stroke="#555d59" stroke-width="1.8" marker-end="url(#ah)"/><text x="68" y="360" class="m" fill="#555d59" text-anchor="start">y<tspan dy="4" class="sb">0</tspan><tspan dy="-4">​</tspan></text><path d="M380,96 H535 V192" fill="none" stroke="#555d59" stroke-width="1.8" marker-end="url(#ah)"/><path d="M275,304 V238 H436" fill="none" stroke="#555d59" stroke-width="1.8" marker-end="url(#ah)"/><path d="M630,238 H676" fill="none" stroke="#555d59" stroke-width="1.8" marker-end="url(#ah)"/><path d="M780,196 V154" fill="none" stroke="#2f8f6c" stroke-width="1.8" marker-end="url(#ahJ)"/><text x="790" y="176" class="m" fill="#1f6b4f" text-anchor="start">L = 0</text><path d="M780,280 V300" fill="none" stroke="#cf5b4f" stroke-width="1.8" marker-end="url(#ahR)"/><text x="790" y="296" class="m" fill="#a3372c" text-anchor="start">L = 1</text><path d="M680,376 H634" fill="none" stroke="#2a5bd7" stroke-width="1.8" marker-end="url(#ahA)"/><text x="657" y="368" class="m" fill="#1d45a8" text-anchor="middle">m<tspan dy="4" class="sb">t</tspan><tspan dy="-4">​</tspan></text><path d="M440,376 H384" fill="none" stroke="#2a5bd7" stroke-width="2.4" marker-end="url(#ahA)"/><text x="412" y="368" class="m" fill="#1d45a8" text-anchor="middle">∇</text></svg>